<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes blink {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .blinking-emoji {
        color: white;
        animation: blink 1s infinite;
      }
    </style>
  </head>
  <body style="background-color: #444444;">
    <div class="flex justify-center items-center h-screen">
      <div class="text-center">
        <h1 class="text-center text-2xl text-bold m-4">
          <div class="blinking-emoji">
            🔴<strong>Live Streaming of fight detection</strong>
          </div>
        </h1>
        <img class="mx-auto w-[50%] h-[50%] rounded-lg shadow-lg" src="{{ url_for('video') }}"/>
      </div>
      <div class="flex flex-col w-1/4 h-screen bg-gray-200" style="background-color: #979797;">
        <h1>
          <div class="blinking-emoji text-center">
            🔴<strong style="color: black;">History of Fight Detection</strong>
          </div>
        </h1>
        <img src="../static/persons-0.png" alt="Image 0" class="h-[50%] m-2 rounded-lg">
        <img src="../static/persons-1.png" alt="Image 1" class="h-[50%] m-2 rounded-lg">
        <img src="../static/persons-2.png" alt="Image 2" class="h-[50%] m-2 rounded-lg">
        <img src="../static/persons-3.png" alt="Image 3" class="h-[50%] m-2 rounded-lg">
        <img src="../static/persons-4.png" alt="Image 4" class="h-[50%] m-2 rounded-lg">
      </div>
    </div>
  </body>
</html>
